services:
  - type: web
    name: ai-chatbot-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: GROQ_API_KEY
        sync: false          # set this manually in the Render dashboard
      - key: CORS_ORIGIN
        sync: false          # set to your Vercel frontend URL after deploying
      - key: PORT
        value: "10000"       # Render assigns its own port via $PORT; this is a fallback
